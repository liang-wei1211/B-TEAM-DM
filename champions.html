      }
      render();
    });

    districtSelect.addEventListener('change', render);
    scopeSelect.addEventListener('change', render);
    searchInput.addEventListener('input', render);

    function render() {
      const city = citySelect.value;
      const district = districtSelect.value;
      const scope = scopeSelect.value;
      const search = searchInput.value.trim().toLowerCase();

      // 1. 篩選
      let list = clinics.filter(c => {
        const matchCity = !city || c.city === city;
        const matchDistrict = !district || c.district === district;
        const matchSearch = !search ||
          c.name.toLowerCase().includes(search) ||
          c.code.includes(search) ||
          c.district.includes(search);
        
        let matchScope = true;
        if (scope === 'top10') {
          matchScope = c.distRank <= 10;
        }

        return matchCity && matchDistrict && matchSearch && matchScope;
      });

      // 2. 排序
      if (scope === 'allRate') {
        list.sort((a, b) => b.rate - a.rate);
      } else {
        // 預設依縣市鄉鎮、再依區域排名排序
        if (!city && !district) {
          list.sort((a, b) => a.natRank - b.natRank);
        } else {
          list.sort((a, b) => a.distRank - b.distRank || b.cases - a.cases);
        }
      }

      // 3. 更新標題文字
      const titleEl = document.getElementById('currentRegionTitle');
      const subEl = document.getElementById('currentRegionSubtitle');
      if (city && district) {
        titleEl.textContent = `📍 ${city} ${district}・收案排行榜`;
        subEl.textContent = `檢視 ${city} ${district} 之指標前線診所名單`;
      } else if (city) {
        titleEl.textContent = `📍 ${city}・各區院所名錄`;
        subEl.textContent = `檢視 ${city} 全轄區院所收案與照護率指標`;
      } else {
        titleEl.textContent = `🏆 全國各區糖尿病照護排行榜`;
        subEl.textContent = `支援全台 22 縣市、300+ 鄉鎮市區冠軍與前十名精準查詢`;
      }

      document.getElementById('resultCountBadge').textContent = `符合診所：${list.length} 家`;

      // 4. 渲染卡片
      const container = document.getElementById('clinicContainer');
      if (list.length === 0) {
        container.innerHTML = `
          <div class="col-span-full py-16 text-center text-slate-400 bg-white rounded-2xl border border-dashed border-slate-300">
            查無符合條件的診所，請嘗試調整搜尋字詞或下拉篩選
          </div>
        `;
        return;
      }

      container.innerHTML = list.map(item => {
        let badgeHtml = '';
        if (item.distRank === 1) {
          badgeHtml = `<span class="px-2.5 py-1 rounded-full text-xs font-extrabold rank-badge-1 flex items-center gap-1">🥇 ${item.district} 冠軍</span>`;
        } else if (item.distRank === 2) {
          badgeHtml = `<span class="px-2.5 py-1 rounded-full text-xs font-bold rank-badge-2 flex items-center gap-1">🥈 第 2 名</span>`;
        } else if (item.distRank === 3) {
          badgeHtml = `<span class="px-2.5 py-1 rounded-full text-xs font-bold rank-badge-3 flex items-center gap-1">🥉 第 3 名</span>`;
        } else {
          badgeHtml = `<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold rank-badge-normal">第 ${item.distRank} 名</span>`;
        }

        // 照護率色彩指示
        let rateColor = "text-blue-600";
        if (item.rate >= 80) rateColor = "text-emerald-600";
        else if (item.rate < 50) rateColor = "text-amber-600";

        return `
          <div class="bg-white p-4 rounded-2xl border border-slate-200/90 shadow-sm hover:border-blue-400 hover:shadow-md transition flex flex-col justify-between">
            <div>
              <div class="flex justify-between items-start gap-2 mb-2">
                <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-slate-100 text-slate-700">
                  ${item.city} ${item.district}
                </span>
                ${badgeHtml}
              </div>

              <h3 class="text-base font-bold text-slate-900 leading-snug">
                ${item.name}
              </h3>
              
              <div class="flex items-center gap-3 text-xs text-slate-400 mt-1">
                <span>代碼：${item.code}</span>
                <span>•</span>
                <span class="font-medium text-slate-500">全國排名：第 ${item.natRank} 名</span>
              </div>
            </div>

            <div class="mt-4 pt-3 border-t border-slate-100">
              <div class="grid grid-cols-2 gap-2 text-xs">
                <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                  <span class="text-slate-400 block text-[11px] mb-0.5">糖號收案人數 (分母)</span>
                  <span class="text-lg font-black text-blue-900">${item.cases.toLocaleString()}</span>
                  <span class="text-xs text-slate-500"> 人</span>
                </div>
                <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                  <span class="text-slate-400 block text-[11px] mb-0.5">加入照護方案比率</span>
                  <span class="text-lg font-black ${rateColor}">${item.rate}%</span>
                </div>
              </div>

              <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.city + item.district + ' ' + item.name)}" target="_blank" class="mt-3 block text-center py-2 bg-slate-100 hover:bg-blue-50 hover:text-blue-600 text-xs font-bold rounded-xl text-slate-600 transition flex items-center justify-center gap-1">
                <span>Google 地圖搜尋此診所</span>
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                </svg>
              </a>
            </div>
          </div>
        `;
      }).join('');
    }

    // 初次載入渲染
    render();
  </script>
</body>
</html>
